server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 192.168.178.102 localhost iws;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # ==============================================
    # GZIP Compression
    # ==============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;               # balance between speed and compression
    gzip_min_length 256;             # don't compress tiny files
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        font/x-woff
        font/woff
        font/woff2
        image/x-icon
        image/vnd.microsoft.icon;

    # ==============================================
    # Security Headers (optional but recommended)
    # ==============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==============================================
    # Main React app
    # ==============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==============================================
    # Static assets – long‑term caching
    # ==============================================
    location ~* \.(?:css|js|svg|woff2?|ttf|eot|otf|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;   # reduce log noise
    }

    # ==============================================
    # API proxy (with CORS)
    # ==============================================
    location /api/ {
        # CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://iws' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            return 204;
        }

        proxy_pass http://iws-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header 'Access-Control-Allow-Origin' 'https://iws' always;
    }

    # ==============================================
    # Runtime env config – never cache
    # ==============================================
    location = /env-config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }

    # ==============================================
    # Optional: deny access to hidden files
    # ==============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
